  pharmago-infra.json: |
    {"title":"PharmaGo - Infra","uid":"pharmago-infra","tags":["pharmago","infra"],"time":{"from":"now-15m","to":"now"},"panels":[{"id":1,"title":"CPU %","type":"timeseries","gridPos":{"x":0,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)","legendFormat":"{{instance}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}},{"id":2,"title":"Memoria usada %","type":"timeseries","gridPos":{"x":12,"y":0,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100","legendFormat":"{{instance}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}},{"id":3,"title":"Disco disponible %","type":"timeseries","gridPos":{"x":0,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"(node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"}) * 100","legendFormat":"{{mountpoint}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100}}},{"id":4,"title":"CPU por pod (pharmago)","type":"timeseries","gridPos":{"x":12,"y":8,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"pharmago\"}[5m])) * 100","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"percent","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":5,"title":"Memoria por pod (pharmago)","type":"timeseries","gridPos":{"x":0,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"pharmago\"})","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"bytes","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":6,"title":"Red nodo (rx/tx)","type":"timeseries","gridPos":{"x":12,"y":16,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(node_network_receive_bytes_total{device=~\"eth.*|en.*\"}[5m])","legendFormat":"rx {{device}}","refId":"A"},{"expr":"rate(node_network_transmit_bytes_total{device=~\"eth.*|en.*\"}[5m])","legendFormat":"tx {{device}}","refId":"B"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":7,"title":"I/O disco nodo","type":"timeseries","gridPos":{"x":0,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"rate(node_disk_read_bytes_total[5m])","legendFormat":"read {{device}}","refId":"A"},{"expr":"rate(node_disk_written_bytes_total[5m])","legendFormat":"write {{device}}","refId":"B"}],"fieldConfig":{"defaults":{"unit":"Bps","min":0},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":8,"title":"Pod restarts (pharmago)","type":"timeseries","gridPos":{"x":12,"y":24,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"increase(kube_pod_container_status_restarts_total{namespace=\"pharmago\"}[5m])","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"short","min":0},"overrides":[]},"options":{"legend":{"calcs":["mean","max"],"displayMode":"table","placement":"bottom","showLegend":true}}},{"id":9,"title":"Pods ready (pharmago)","type":"timeseries","gridPos":{"x":0,"y":32,"w":12,"h":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"kube_pod_status_ready{namespace=\"pharmago\",condition=\"true\"}","legendFormat":"{{pod}}","refId":"A"}],"fieldConfig":{"defaults":{"unit":"short","min":0,"max":1},"overrides":[]},"options":{"legend":{"displayMode":"table","placement":"bottom","showLegend":true}}}],"schemaVersion":38,"version":0}
