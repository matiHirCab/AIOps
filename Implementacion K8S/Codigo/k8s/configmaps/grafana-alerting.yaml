apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: pharmago
data:
  alerting.yml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: pharmago-alerts
        folder: PharmaGo Alerts
        interval: 1m
        rules:
          - uid: alert-cpu-nodo
            title: "CPU nodo > 80%"
            condition: C
            for: 2m
            annotations:
              summary: "CPU del nodo supera el 80%"
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  refId: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 80

          - uid: alert-memoria-nodo
            title: "Memoria nodo > 85%"
            condition: C
            for: 2m
            annotations:
              summary: "Memoria del nodo supera el 85%"
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  refId: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 85

          - uid: alert-pod-restarts
            title: "Pod restarts > 3 en 5min"
            condition: C
            for: 0s
            annotations:
              summary: "Un pod en pharmago se reinicio mas de 3 veces en 5 minutos"
            labels:
              severity: critical
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: "increase(kube_pod_container_status_restarts_total{namespace=\"pharmago\"}[5m])"
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: max
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  refId: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 3

          - uid: alert-error-rate
            title: "Error rate HTTP > 5%"
            condition: C
            for: 1m
            annotations:
              summary: "La tasa de errores HTTP supera el 5%"
            labels:
              severity: critical
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: "(sum(rate(pharmago_http_errors_total[5m])) / sum(rate(pharmago_http_requests_total[5m])) * 100) or vector(0)"
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  refId: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 5

          - uid: alert-latencia-p95
            title: "Latencia promedio > 500ms"
            condition: C
            for: 2m
            annotations:
              summary: "La latencia promedio de los endpoints supera los 500ms"
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  editorMode: code
                  expr: "sum(rate(pharmago_http_request_duration_milliseconds_sum[5m])) / sum(rate(pharmago_http_request_duration_milliseconds_count[5m]))"
                  instant: true
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  refId: B
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  refId: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 500
